name: Frontend main daily build

# Раз в сутки собираем фронт с тестами на main — но ТОЛЬКО если с момента
# прошлой успешной сборки что-то менялось во фронте. Не на каждый коммит:
# триггер — расписание (и ручной запуск), пуши сюда ничего не запускают.
on:
  schedule:
    - cron: '26 17 * * *' # каждый день в 17:26 UTC (подберите удобное время)
  workflow_dispatch: {} # ручной запуск — собирает всегда, без проверки изменений

permissions:
  contents: read
  actions: read # нужно для `gh run list` (ищем прошлую успешную сборку)

concurrency:
  group: frontend-main-daily
  cancel-in-progress: false

env:
  FRONTEND_DIR: frontend
  # Gradle-путь фронт-модуля. Если фронт — КОРНЕВОЙ проект, поставьте пустую строку
  # (тогда задачи станут ':build' / ':yarnTest').
  FRONTEND_MODULE: ':frontend'
  NODE_VERSION: '22.22.3'

jobs:
  # ── 1. Проверяем, менялся ли фронт с прошлой успешной сборки ────────────────
  detect:
    name: Detect frontend changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # полная история — нужна для git diff с прошлым SHA

      - name: Did the frontend change since the last successful build?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Ручной запуск — собираем безусловно.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run — building regardless of changes."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # SHA коммита из последней УСПЕШНОЙ сборки этого воркфлоу на main.
          last_sha=$(gh run list \
            --workflow frontend-main-daily.yml \
            --branch main \
            --status success \
            --limit 1 \
            --json headSha \
            --jq '.[0].headSha // ""' 2>/dev/null || echo "")

          if [ -z "$last_sha" ]; then
            echo "No previous successful build found — building."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # На случай rewrite/force-push: если коммита нет в истории — собираем.
          if ! git cat-file -e "${last_sha}^{commit}" 2>/dev/null; then
            echo "Last built commit $last_sha is not in history — building."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Есть ли изменения во фронте между прошлой сборкой и HEAD?
          # Вместе с фронтом смотрим на сам стенд визуальных кейсов: он живёт
          # в scripts/, но краснеет ровно на тех же правках.
          if git diff --quiet "$last_sha" HEAD -- "$FRONTEND_DIR" scripts/visual-harness.js; then
            echo "No frontend changes since $last_sha — skipping build."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Frontend changes since $last_sha — building."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # ── 2. Полная сборка с тестами (только если что-то менялось) ────────────────
  build:
    name: Build with tests
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Cache node toolchain & modules
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.FRONTEND_DIR }}/node_modules
            ${{ env.FRONTEND_DIR }}/.gradle/nodejs
            ${{ env.FRONTEND_DIR }}/.gradle/yarn
          key: ${{ runner.os }}-frontend-node-${{ env.NODE_VERSION }}-${{ hashFiles(format('{0}/yarn.lock', env.FRONTEND_DIR)) }}
          restore-keys: |
            ${{ runner.os }}-frontend-node-${{ env.NODE_VERSION }}-

      # Прогоняет фронт-модуль целиком: yarnInstall → yarnBuild → copyFrontend
      # плюс check (yarnTest, yarnLint, spotlessCheck). Тесты живут на check и
      # артефакт не гейтят, но `build` тянет и то и другое.
      - name: Build (with tests)
        run: ./gradlew -PuseSystemNode=true "${FRONTEND_MODULE}:build" --no-daemon --stacktrace

      - name: Upload frontend build output
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: ${{ env.FRONTEND_DIR }}/build/dist
          retention-days: 7
          if-no-files-found: warn

  # ── 3. Визуальные кейсы: снимок каждого против эталона ─────────────────────
  # Отдельная джоба, а не шаг сборки: она идёт в контейнере, потому что эталоны
  # принадлежат окружению рендера. Тот же Chromium с другим набором шрифтов
  # рисует иначе (замерено: 42 кейса из 56 расходятся), поэтому образ здесь
  # закреплён по версии, а эталоны в git сняты в нём же. Не совпало окружение —
  # скрипт не красит прогон, а говорит, что сверка пропущена; тогда виноват не
  # интерфейс, а образ, и его версию надо привести в согласие с эталонами.
  visual:
    name: Visual cases against baselines
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    container:
      # Версия та же, что у пакета playwright ниже, и та же, в которой сняты
      # frontend/tests/visual/baselines/ (см. в них environment.json).
      # Окружение, в котором сняты эталоны: тот же тег стоит в run/test.sh
      # (VISUAL_IMAGE), которым сверяются и обновляются эталоны локально.
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v7

      - name: Frontend dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: yarn install --frozen-lockfile

      # Браузеры в образе уже лежат, а npm-пакета playwright в нём нет — ставим
      # его глобально, оттуда же его берёт NODE_PATH ниже.
      - name: Playwright module
        run: npm install --global playwright@1.56.1

      # Скрипт сам собирает стенд (vite) и сверяет каждый снимок с эталоном.
      - name: Harness
        env:
          NODE_PATH: /usr/lib/node_modules
        run: node scripts/visual-harness.js

      # Снимки прогона и картинки расхождений — единственный способ увидеть, что
      # именно разъехалось, не воспроизводя прогон у себя.
      - name: Upload shots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-shots
          path: ${{ env.FRONTEND_DIR }}/tests/visual/harness/shots
          retention-days: 7
          if-no-files-found: warn