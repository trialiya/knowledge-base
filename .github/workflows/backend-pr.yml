name: Backend tests

# Тесты бэкенда на пуш в main, который трогает бэкенд или сборочные файлы, и на
# PR — только после подтверждения: job ждёт approve в окружении ci-approval.
# Затронутые файлы (paths) определяют, появится ли вообще проверка.
#
# Тесты с Testcontainers поднимают PostgreSQL (pgvector) в Docker; на
# ubuntu-latest Docker доступен из коробки, отдельный сервис не нужен.
on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle.lockfile'
      - 'gradle/**'
      - 'gradlew'
      - 'config/pmd/**'
      - 'config/spotbugs/**'
      - '.github/workflows/backend-pr.yml'
  workflow_dispatch: {} # ручной запуск: Actions → Run workflow, выбрать ветку
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle.lockfile'
      - 'gradle/**'
      - 'gradlew'
      - 'config/pmd/**'
      - 'config/spotbugs/**'
      - '.github/workflows/backend-pr.yml'

permissions:
  contents: read

# Новый пуш в ту же ветку отменяет предыдущий прогон.
concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Backend tests
    # На PR job ждёт подтверждения (Review deployments) — обязательный ревьюер
    # настраивается в Settings → Environments → ci-approval. push и ручной
    # запуск идут без окружения, то есть без подтверждения.
    environment: ${{ github.event_name == 'pull_request' && 'ci-approval' || null }}
