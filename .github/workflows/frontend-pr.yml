name: Frontend PR

# Тесты и spotlessCheck фронта на PR, который трогает фронтовые файлы, — только
# по подтверждению: job ждёт approve в окружении ci-approval. Через gradle (:frontend:check), по аналогии с
# backend-pr.yml, чтобы PR гейтились теми же проверками, что и `./gradlew build`.
on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/frontend-pr.yml'
  workflow_dispatch: {} # ручной запуск: Actions → Run workflow, выбрать ветку

permissions:
  contents: read

# Новый запуск на той же ветке отменяет предыдущий прогон.
concurrency:
  group: frontend-pr-${{ github.ref }}
  cancel-in-progress: true

env:
  FRONTEND_DIR: frontend
  FRONTEND_MODULE: ':frontend'
  # Держим в синхроне с build.gradle → node { version = '22.22.3' }
  NODE_VERSION: '22.22.3'

jobs:
  test:
    name: Frontend tests & spotlessCheck
    # На PR job ждёт подтверждения (Review deployments) — обязательный ревьюер
    # настраивается в Settings → Environments → ci-approval. push и ручной
    # запуск идут без окружения, то есть без подтверждения.
    environment: ${{ github.event_name == 'pull_request' && 'ci-approval' || null }}
