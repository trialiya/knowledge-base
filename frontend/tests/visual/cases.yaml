    - Колонку полей и превью делит горизонтальная черта во всю ширину диалога
    - Подпись «Что получится» стоит НАД подложкой, а не внутри неё; в подложке только сама фраза
    - Под полями — вся фраза целиком: на месте пустого плейсхолдера подпись поля приглушённым пунктиром, на месте заполненного значение на акцентной подложке
    - Подложка обтягивает значение вплотную — «{{Тема}}» в кавычках не превращается в « значение »
    - Между подложкой превью и кнопками есть просвет — они не соприкасаются
    - Указатель в превью читается названием файла или темой коммита, а не чип-токеном ⟦file:…⟧
    - Поле указателя с набранным текстом, но без выбранного значения, желтеет (рамка + подложка), как только выдача вернулась пустой или список закрыт
    - Уход из такого поля по Tab закрывает выдачу и подсвечивает поле — набранное в нём остаётся
    - Пока список открыт и в нём есть строки, поле не жёлтое; выбор строки снимает подсветку
    - Фокус при открытии стоит на первом поле любого вида, включая поиск и флажок
    - Список результатов виден целиком: он в портале на body, а .modal-shell и колонка полей обрезают по overflow
    - Клик по соседнему полю диалога закрывает список — ModalShell гасит mousedown, поэтому проверка «клика снаружи» ловит его в фазе перехвата
    - Закрытие списка (Escape, прокрутка колонки, ресайз) не стирает набранное в поле
    - Вставка кладёт в поле ввода чипы файла, коммита и документа, остальное — текстом
    - После вставки каретка стоит в конце вставленного текста, дописывать можно сразу
    - Фраза старого формата ({{файл}} без типа) открывает тот же диалог со строковыми полями
    - Опечатка в типе ({{Файл:fiel}}) даёт строковое поле, двоеточие в подписи ({{Совещание в 10:30}}) типом не считается
  notes: |
    Проверялось в Chromium/Playwright на собранном jar (профиль h2, засеян
    sample-data.sql) — рецепт в scripts/playwright-smoke.js и в скилле
    frontend-visual-check.

    Замеры прогона: модалка 460×461 на шести полях, колонка полей уходит в свой
    скролл начиная примерно с девяти; выпадающий список — position: fixed,
    z-index 1200, ставится на 3px ниже поля.

    Якорь списка фиксируется на открытии и за полем не следит, поэтому прокрутка
    колонки полей список закрывает — но набранный текст в поле остаётся, и
    возврат в поле возобновляет по нему поиск. То же с Escape: первый закрывает
    список, второй — диалог. Enter, пока идёт поиск, диалог не отправляет; когда
    выдача пуста и выбирать нечего — отправляет.

    Флажок в превью показывает «нет» ещё до того, как его тронули, и «нет»
    действительно уедет в текст: пустого состояния у флажка нет, в отличие от
    остальных типов (у них незаполненное поле оставляет свой {{…}} литералом).

    Жёлтая подсветка (--kb-warning / --kb-warning-bg) — состояние поля, а не
    выдачи: она держится и после того, как список закрыт, потому что считается
    по «есть текст, нет выбора, и выбирать не из чего». Прогон 2026-08-10:
    набранное «библиотека-фраз.mdфыв» → выдача пуста → поле жёлтое, Escape
    список закрыл, подсветка осталась; выбор строки её снял.

    Каретка после «Вставить» замерена в браузере: смещение 80 из 80 символов
    поля ввода, фокус на самом редакторе. После «Отмена» она тоже в конце —
    поверх черновика «черновик» набранное дописалось хвостом (8 из 8).

- id: settings-tools-catalog
  component: ToolCatalog
  path: frontend/src/components/settingsPanel/ToolCatalog.jsx
  title: 'Инструменты — каталог: выбор из выпадашки, под ней описание и аргументы'
  status: verified
  origin:
    - сессия 2026-08-13, вынос списка инструментов в «Настройки»
  preconditions:
    viewport: [1440, 900]
    auth: admin
    route: /settings
    profile: h2
    click: список групп «Настройки» → «Инструменты» → выпадашка в шапке секции
    data: Бэкенд поднят с PROJECT_PATH=. (сам репозиторий), правка файлов и скрипты выключены
  fixtures: ./fixtures/toolCatalog.js#builtinTools
  expected:
    - 'Секция «Доступные инструменты» стоит первой в группе, в её заголовке — счётчик (на дефолтном конфиге 33)'
    - Справа в шапке секции выпадашка — человеческий лейбл и приглушённое техническое имя рядом; список отсортирован по лейблу и открывается вниз
    - Меню не обрезается карточкой секции и перекрывает содержимое под ней
    - До первого выбора показан первый пункт списка, а не первый по техническому имени
    - 'Карточка выбранного: иконка, лейбл, техническое имя пилюлей; ниже описание для модели как есть (перенос строк сохраняется)'
    - 'Аргументы: имя моноширинным, тип (string / integer / array<string>) акцентом, бейдж «обязательный» зелёный или «необязательный» серый, под ними описание из схемы'
    - У инструмента без аргументов вместо списка подпись «Без аргументов»
    - У инструмента внешнего MCP-сервера рядом с именем стоит пилюля MCP
  notes: |
    Проверялось в Chromium/Playwright на собранном jar (профиль h2), интерфейс
    в русской локали — рецепт в scripts/playwright-smoke.js и в скилле
    frontend-visual-check.

    Список приходит из GET /api/settings/tools, а он собран из тех же
    ToolCallback, что отданы модели: на дефолтном конфиге в нём 33 инструмента,
    без createFile/editFile (kb.git.edit-enabled выключен) и без runScript
    (kb.script.enabled выключен). Строку с MCP-инструментом вживую не снимали —
    внешнего сервера в песочнице нет, отсюда фикстура withMcpTool.

    Выпадашка — общий ListboxSelect (common/), тот же, что выбирает модель и
    режим в чате; здесь он раскрывается вниз (placement по умолчанию), в чате —
    вверх. Карточка секции по умолчанию обрезает содержимое по своим границам,
    поэтому секции с меню в шапке передают overflow (см. SettingsSection).

- id: modal-find-scoped-to-dialog
  component: ModalShell + ModalFindBar
  path: frontend/src/components/common/ModalFindBar.jsx
  title: Ctrl+F при открытой модалке ищет по диалогу, а не по странице под ним
  status: verified
  origin:
    - Сессия 2026-08-14, поиск внутри модалок
  preconditions:
    viewport: [1440, 900]
    auth: admin
    route: /chat, засеянный чат «История коммитов backend/build.gradle»
    click: чип вложения gradle-build-error.log в отправленном сообщении → Ctrl+F → «gradle»
  fixtures: ./fixtures/modalFind.js#dialogContent
  expected:
    - Бар встаёт первой строкой внутри диалога, содержимое не перекрывает — верх бара совпадает с верхом диалога
    - Полоса бара прижата к кромкам диалога одинаково в модалке с внутренними отступами («Создать» в базе знаний) и без них (превью вложения) — во всех трёх измерениях зазор 0
    - Счётчик считает только вхождения внутри диалога (3), а не 11 в переписке под оверлеем
    - Активное совпадение залито насыщенным янтарным, остальные — бледно-жёлтым; при первом вводе активно первое по порядку
    - Enter (и кнопка «вниз») переводит на следующее совпадение, Shift+Enter (и кнопка «вверх») — на предыдущее, по кругу
    - Первый Escape закрывает бар и оставляет диалог открытым, второй закрывает диалог
    - Без открытой модалки Ctrl+F по-прежнему открывает find-бар чата (.chat-search-bar), а не бар модалки
  notes: |
    Проверялось в Chromium/Playwright на собранном jar (профиль h2, засеян
    sample-data.sql), интерфейс в русской локали — рецепт в
    scripts/playwright-smoke.js и в скилле frontend-visual-check.

    Замеры прогона: зазор между баром и кромками диалога {top: 0, left: 0,
    right: 0} и в превью вложения (padding: 0), и в форме «Создать»
    (padding: 1.5rem) — собственные отступы диалога бар вычитает по токенам
    --modal-shell-pad-* (modalShell.css). Бар лежит внутри
    [aria-modal="true"], в CSS.highlights зарегистрированы обе группы —
    kb-modal-find и kb-modal-find-active. По «gradle» в диалоге 3 совпадения,
    в .message-list под ним — 11.

    Подсветка живёт в CSS Custom Highlight API, поэтому DOM, которым владеет
    React, не трогается; в браузере без поддержки остаются счётчик и прокрутка
    к совпадению — сама навигация не ломается.
