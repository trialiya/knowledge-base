    через SPRING_APPLICATION_JSON). Замеры: .file-tree-row--untracked — 6 строк,
    высота триггера и поля 32px обе, верх .files-panel-tree до и после открытия поиска
    182.98 (сдвига нет), ширина выпадающего списка 522px при правом крае на 582 из 1440.

- id: files-uncommitted-changes
  component: ChangesList
  path: frontend/src/components/filesPanel/changes/ChangesList.jsx
  title: Панель «Файлы» — режим «Изменения»: список незакоммиченных файлов и diff в центре
  status: verified
  origin:
    - Сессия 2026-08-23, новый режим левого блока
    - Сессия 2026-08-24, шапка патча над блоком кода и сортировка плоского списка
  preconditions:
    viewport: [1440, 900]
    auth: admin
    route: /files?changes=1
    backend: |
      kb.projects[0].allow-globs: ['build-reports/**']; в рабочем дереве — правка
      отслеживаемого файла, удалённый отслеживаемый файл, переименованный файл и
      неотслеживаемый файл в build-reports/
    steps: |
      переключить тулбар на «Изменения» → открыть изменённый файл → переключить
      «Diff» в мета-строке центра → переключить раскладку кнопкой в тулбаре →
      открыть неотслеживаемый файл и удалённый файл
  expected:
    - Слева сначала секция «Отслеживаемые», ниже отдельной секцией «Неотслеживаемые» со своим счётчиком
    - У каждой строки слева буква статуса (M/D/R/U) в колонке постоянной ширины, имена файлов выстроены по одному левому краю
    - Счётчики +N/−M прижаты к правому краю строки и выглядят как в чате
    - В плоской раскладке перед именем стоит приглушённый каталог; кнопка в тулбаре переключает на иерархию, где каталоги-цепочки склеены в одну строку
    - 'Плоская раскладка отсортирована по имени файла, а не по порядку git: одноимённые файлы из разных каталогов стоят рядом'
    - 'Шапка патча (diff --git, index, --- a/…, +++ b/…) — серые строки над блоком кода, а не внутри него; блок начинается с заголовка ханка @@, как в режиме «Обзор» в чате'
    - Раскладка переживает перезагрузку страницы (localStorage), режим — нет: он в адресе (?changes=1)
    - Изменённый файл открывается сразу в diff, неотслеживаемый — содержимым; тумблер «Diff» в мета-строке переключает оба
    - Удалённый файл показывает diff без тумблера — оригинала в рабочем дереве нет
    - Переключение на «Файлы» возвращает дерево репозитория, выбранный путь при этом не теряется
  notes: |
    Прогнано ad hoc скриптом по образцу scripts/playwright-smoke.js: allow-globs
    (frontend/src/components/filesPanel/**) поданы через SPRING_APPLICATION_JSON, а
    изменениями служило само рабочее дерево ветки — 17 отслеживаемых (M) и 12
    неотслеживаемых (U). Замеры и находки: строка списка НЕ берёт .ws-item--nowrap
    (в отличие от дерева файлов) — иначе .ws-item__label получает flex:0 0 auto и
    выдавливает +N/−M за правый край панели; каталог в плоском списке стоит ПОСЛЕ
    имени и берёт flex:1 0 0, иначе при равном flex-shrink он сжимает имя файла
    раньше себя («GitC…» вместо «GitController.java»). Тулбар в две строки: режим
    и раскладка сверху, поиск отдельной строкой во всю ширину — в одну строку
    кнопка раскладки оказывалась под кнопкой «Изменения».
