- id: kb-detail-header-deep-path
  component: DetailHeader
  path: frontend/src/components/knowledgeBasePanel/DetailHeader.jsx
  title: Шапка документа с длинным путём — крошки сжимаются, имя остаётся целым
  status: blocked
  origin:
    - PR #155, сессия 2026-07-26
  preconditions:
    viewport: [1150, 700]
    auth: admin
    route: /knowledge/doc/<id документа из фикстуры>
  fixtures: ./fixtures/detailHeader.js#documentDeepPath
  expected:
    - Крошки уступают место первыми — сжимаются, пока имя открытого узла целое
    - Строка одна, шапка не растёт в высоту
    - Прокрутка крошек прижата к концу — ближайшая папка видна, начало пути уезжает влево
  notes: |
    Блокировано данными: в db/sample-data.sql дерево двухуровневое
    (одна папка в корне → два документа), у документа всегда ровно один предок,
    переполнения не бывает. Замер crumbsPinnedToEnd в PR #155 вышел тривиальным
    (scrollLeft 0 == maxScroll 0) и за проверку не считается.
    Ожидание выведено из кода (HeadCrumbs.jsx, .workspace__head-crumbs в
    common/workspaceLayout.css), а не из наблюдения. Фикстура готова —
    для стори этого достаточно, для Playwright нужен сид с глубоким деревом.

