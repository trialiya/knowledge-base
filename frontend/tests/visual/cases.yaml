    - Имя файла остаётся полноконтрастным — такой файл читается и правится
    - Выбранная строка вне git остаётся оранжевой (оттенком гуще) и не теряет акцентную полосу и жирный акцентный текст
    - В выдаче поиска те же файлы залиты тем же оттенком, tracked-строки — обычные
