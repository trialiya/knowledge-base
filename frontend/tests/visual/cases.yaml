- id: kb-empty-no-selection
  component: KnowledgeBase
  path: frontend/src/components/knowledgeBasePanel/KnowledgeBase.jsx
  title: База знаний без выбранного документа — у центра нет шапки
  status: verified
  origin:
    - PR #155, сессия 2026-07-26
  preconditions:
    viewport: [1440, 900]
    auth: admin
    route: /knowledge
  fixtures: ./fixtures/knowledgeBaseTree.js#singleFolderTree
  expected:
    - В центре плейсхолдер «Select a document to view»
    - Шапки центра (.workspace__head) в DOM нет вовсе — она принадлежит открытому узлу, а его нет
    - Слева шапка «Documents», кнопка «Create», поиск и свёрнутая папка «анализ»
  notes: |
    Это экранный кейс, а не компонентный: он про отсутствие шапки в разделе
    целиком, и в стори без стора и роутера не разворачивается — Playwright
    подходит лучше.
    Практическое следствие для будущих замеров: на этом роуте нельзя мерить
    шапку через document.querySelector('.workspace__head') — разделы чата и
    базы знаний смонтированы одновременно, и селектор поймает чужую шапку.
    Мерить надо внутри видимой секции.

- id: files-breadcrumb-deep-path
  component: Breadcrumb
  path: frontend/src/components/filesPanel/Breadcrumb.jsx
  title: Глубокий путь к файлу — строка не переносится и прокручена к концу
  status: verified
  origin:
    - PR #155, сессия 2026-07-26
    - Сессия 2026-07-26, оптимизация открытия глубоких ссылок (перепроверен на живом бэкенде)
  preconditions:
    viewport: [1150, 820]
    auth: admin
    route: /files/<путь из фикстуры>
  fixtures: ./fixtures/filesBreadcrumb.js#deepJavaPath
  expected:
    - Крошки идут одной строкой, шапка не растёт в высоту
    - 'Начало пути обрезано слева (от «backend» видно только хвост «nd») — строка прокручена к концу'
    - Имя файла «MovePhraseRequest.java» видно целиком, жирным, и это не кнопка
    - Полосы прокрутки не видно
    - Высота шапки 56px, совпадает с шапкой левой панели
    - Крошки появляются сразу из URL, не дожидаясь ответа бэкенда (FileContent берёт путь из пропа, а не из загруженного содержимого)
  notes: |
    Ключевой кейс на прижатие скролла к концу пути (HeadCrumbs.jsx): до PR #155
    контейнер оставался прокручен в начало, и глубокий путь показывал корень,
    обрывая строку ровно на самой полезной крошке.
    Файл существует в репозитории, поэтому кейс годится и для прогона поверх
    живого бэкенда с PROJECT_PATH=.
    Перепроверено на живом бэкенде (jar + h2, PROJECT_PATH=., Chromium) на пути
    backend/src/main/java/io/github/trialiya/kb/service/GitService.java: дерево
    слева раскрыто до файла и строка подсвечена, центр и вкладка «Инфо»
    заполнены. Запросов к /api/git при этом два и оба параллельные — browse и
    commits (было одиннадцать последовательных).

