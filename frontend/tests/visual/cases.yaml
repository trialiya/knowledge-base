# Реестр визуальных кейсов
#
# Что это. Сценарии, которыми компоненты уже проверялись руками, вместе с
# данными для них. Цель — чтобы следующая сессия не придумывала проверки заново
# (другие, неполные и на других данных), а взяла отсюда. Заготовка под
# Storybook + Playwright: из кейса должна собираться стори без уточняющих
# вопросов.
#
# Правила ведения:
#   • id стабилен навсегда — он станет именем стори и именем baseline-снимка.
#     Переименование = потеря baseline.
#   • Похожий кейс уже есть? Дополни его (уточни expected, допиши origin), а не
#     заводи второй id. Дубликаты под разными именами — главная ошибка здесь.
#   • Данные — только в fixtures/<компонент>.js именованными экспортами, и
#     только статика: без Date.now(), Math.random(), реальных id из базы,
#     живых токенов и персональных данных.
#   • status: verified — наблюдалось в браузере; broken — воспроизведённый
#     дефект (тогда ссылка на issue/строку); blocked — кейс описан, но прогнать
#     нечем (нет данных, нужен недостижимый бэкенд/состояние).
#   • expected пишем проверяемо: что видно на экране, а не «выглядит хорошо».
#
# Как проверялись кейсы со status: verified в PR #155. Дев-сервер в веб-песочнице
# не работает, поэтому прогон шёл через собранный jar с профилем h2, засеянный
# backend/src/test/resources/db/sample-data.sql, под Chromium/Playwright с
# HTTP Basic admin/admin (рецепт — в scripts/playwright-smoke.js и CLAUDE.md,
# раздел «Visually validating the frontend»). Фикстуры ниже — те же данные,
# переписанные под пропсы компонентов и с синтетическими id.

- id: chat-header-single-row
  component: ChatHeader
  path: frontend/src/components/chatPanel/ChatHeader.jsx
  title: Шапка активного чата — одна строка, без даты создания
  status: verified
  origin:
    - PR #155, сессия 2026-07-26
  preconditions:
    viewport: [1440, 900]
    auth: admin
    route: /
  fixtures: ./fixtures/chatHeader.js#activeChatProps
  expected:
    - Заголовок чата в одну строку, длинный режется многоточием
    - Под заголовком ничего нет — дата создания убрана в правую панель, вкладка «Инфо»
    - Справа в шапке две иконки — поиск по чату и удаление
    - Высота шапки 56px, её верхняя граница совпадает с шапкой левой панели («Chats»)
  notes: |
    Замерено в браузере: центральная шапка {h: 56, top: 79}, шапки боковых
    панелей — тоже {h: 56, top: 79}.
    Правая панель в этом прогоне была свёрнута в рельс (состояние по умолчанию)
    с бейджем вложений «1» — это не часть кейса, но так выглядел снимок.

