    селектор стоит заголовком панели, переключение уводит на /files?project=billing, дерево и
    список перерисовываются целиком, третий проект показан как «Archive (недоступен)». Селектор
    композера чата в том же прогоне показывает все три, помечает текущий «(по умолчанию)» и
    недоступный — «(недоступен)».

