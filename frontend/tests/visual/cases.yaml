- id: composer-paste-undo-and-linebreaks
  component: ChipEditor
  path: frontend/src/components/chatPanel/ChipEditor.jsx
  title: 'Композер — вставка: Ctrl+Z отменяет её, переносы строк не двоятся'
  status: verified
  origin:
    - PR #130 — вставка через execCommand ради нативной отмены; sentinel и Shift+Enter
    - PR #147 — пересборка DOM после многострочной вставки (плоский DOM)
    - сессия 2026-08-02, починка Ctrl+Z после вставки
  preconditions:
    viewport: [1440, 900]
    auth: admin
    route: /chat
    data: Любой чат; проверка идёт в поле ввода сообщения
    keys: |
      ТОЛЬКО настоящими нажатиями клавиш и настоящим событием paste.
      Прямые мутации DOM маскируют половину этих дефектов: Range при каретке
      внутри текста расщепляет текстовый узел, и хвостовой <br> ведёт себя
      иначе, чем при программной вставке (см. последний коммит PR #130).
  expected:
    - Вставка одной строки отменяется по Ctrl+Z целиком, поле возвращается к тому, что было до неё
    - Вставка многострочного текста отменяется по Ctrl+Z одним нажатием, включая текст с хвостовым переносом
    - Вставленный многострочный текст даёт ровно те же переносы, что были в буфере — без лишнего в конце
    - Первый Shift+Enter в пустом поле сразу даёт видимую пустую строку, каретка стоит на ней
    - Shift+Enter в конце набранного текста срабатывает с первого нажатия, следующий ввод идёт на новую строку
    - Shift+Enter в начале второй строки даёт одну пустую строку, а не две
    - После многострочной вставки хвостовой Shift+Enter срабатывает с первого нажатия
    - Удаление всего текста очищает поле — не остаётся пустой строки поверх placeholder
    - Ввод на новой строке не оставляет фантомного sentinel-<br>
  notes: |
    Отмену ломала пересборка DOM: renderValue стирает поле через
    `textContent = ''`, а Chrome выбрасывает стек отмены, как только скрипт
    заменяет узлы, на которые ссылаются его шаги. PR #147 добавил эту
    пересборку ради плоского DOM и тем самым молча отменил цель PR #130,
    оставив комментарий, что Ctrl+Z работает. Поэтому в кейсе обе группы
    проверок сразу: если чинить одну, вторую надо прогонять следом.

    Сейчас вставка идёт построчно через execCommand (insertText на строку,
    insertLineBreak на перенос — insertPlainText в fileChipEditorDom.js), DOM
    выходит плоским сам собой и пересобирать его не нужно. В fileChipEditorDom.js
    по той же причине хвостовой sentinel-<br> не пересоздаётся, если уже стоит
    на месте: удалить его — значит выдернуть узел, созданный самим браузером.

    Замечание про Ctrl+Z: если печатать и сразу вставлять, Chrome сливает
    печать и вставку в один шаг отмены и снимает всё разом. Это его штатное
    поведение (воспроизводится на голом contenteditable), не дефект композера —
    при проверке разделяйте их движением каретки.

    Прогонялось в Chromium/Playwright на портированных обработчиках композера,
    A/B против кода до правки: сценарии про Shift+Enter одинаково зелёные до и
    после, отмена вставки — только после.

