<!DOCTYPE html>
<html lang="ru">
<head>
    <!-- Обязательные мета-теги -->
    <meta charset="utf-8"/>
    <link rel="icon" href="/favicon.ico"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="theme-color" content="#000000"/>

    <!--
      Оптимизация для SEO и описания приложения.
      Это описание будет показываться в результатах поиска Google.
    -->
    <meta name="description"
          content="AI Knowledge Base"/>

    <!--
      Manifest.json файл для PWA (Progressive Web App).
      Позволяет установить приложение на главный экран мобильного устройства.
    -->
    <link rel="manifest" href="/manifest.json"/>

    <!-- Заголовок вкладки в браузере -->
    <title>AI Knowledge Base </title>

    <!--
      Тема ставится ДО загрузки бандла и до первой отрисовки. Иначе первый кадр
      всегда светлый: стили уже применились, а React, который проставит атрибут,
      ещё не выполнился — на тёмной теме это вспышка белого во весь экран при
      каждой перезагрузке.

      Скрипт повторяет useTheme.js в трёх строках и обязан оставаться с ним
      согласованным: ключ хранилища, три допустимых значения, разрешение
      «системной» через matchMedia. Собственное значение пишется только сюда, в
      localStorage не пишем — здесь мы читатель.
    -->
    <script>
      try {
        var choice = localStorage.getItem('ui_theme');
        if (choice !== 'light' && choice !== 'dark') {
          choice = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = choice;
      } catch (e) {
        /* приватный режим, отключённые куки — остаётся светлая тема по умолчанию */
      }
    </script>
</head>
<body>
<!--
  Если у пользователя отключен JavaScript, он увидит это сообщение.
  React-приложения не могут работать без JS.
-->
<noscript>Для работы этого приложения необходимо включить JavaScript.</noscript>

<!--
  САМАЯ ВАЖНАЯ ЧАСТЬ!
  Это "корневой" контейнер, в который React будет "монтировать" все компоненты.
  Весь ваш интерфейс (App.jsx, ChatWindow.jsx и т.д.) будет отображен внутри этого div.
-->
<div id="root"></div>

<!--
  Точка входа. Vite сам подменит этот тег на собранные js/css при `vite build`.
-->
<script type="module" src="/src/index.jsx"></script>
</body>
</html>
