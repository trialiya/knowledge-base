plugins {
    id 'com.github.node-gradle.node' version '7.1.0'
    id 'com.diffplug.spotless'
}

node {
    version = '22.22.3'

    yarnVersion = '1.22.22'

    workDir = file("${project.projectDir}/.gradle/nodejs")

    yarnWorkDir = file("${project.projectDir}/.gradle/yarn")

    nodeProjectDir = file("${project.projectDir}")

    if (project.hasProperty('useSystemNode')) {
        download = ! project.getProperty('useSystemNode').toBoolean()
    } else {
        download = true
    }
}

spotless {
    format 'react', {
        target 'src/**/*.js', 'src/**/*.jsx', 'src/**/*.ts', 'src/**/*.tsx', 'src/**/*.css', 'src/**/*.scss',
                'vite.config.js', 'eslint.config.js'

        prettier().config([
                'semi': true,
                'singleQuote': true,
                'trailingComma': 'all',
                'printWidth': 120
        ])
    }
}

// Фронтовые тесты — часть верификации (`check`), а не сборки артефакта: `yarnBuild`
// и всё, что тянет его (`copyFrontend`, `:backend:bootJar`), собирают фронт без vitest.
// Тесты можно отключить и в `check`:
//   ./gradlew build -PskipFrontendTests
// либо точечно исключить задачу:
//   ./gradlew build -x yarnTest
boolean runFrontendTests = !project.hasProperty('skipFrontendTests')

tasks.register('yarnServe', YarnTask) {
    args = ['run', 'start']
}

tasks.register('yarnInstall', YarnTask) {
    args = ['install', '--frozen-lockfile']  // падает если yarn.lock устарел
    inputs.files('package.json', 'yarn.lock')
    outputs.dir('node_modules')
}

tasks.register('yarnTest', YarnTask) {
    dependsOn('yarnInstall')
    // `vitest run` (в отличие от `vitest`) прогоняет тесты один раз и выходит,
    // watch-режим включать нечем — CI=true тут больше не нужен.
    // --passWithNoTests не валит сборку, если тестов ещё нет в каком-то модуле.
    args = ['run', 'test', '--passWithNoTests']
    inputs.dir('src')
    inputs.files('package.json', 'yarn.lock', 'vite.config.js')
    // У тестов нет файлового артефакта → не помечаем как up-to-date, гоняем при вызове.
    outputs.upToDateWhen { false }
}

tasks.register('yarnLint', YarnTask) {
    dependsOn('yarnInstall')
    // ESLint приезжал внутри react-scripts и гонялся на каждой сборке CRA;
    // после перехода на Vite его держим явной задачей. Prettier (spotless
    // format 'react') его не заменяет — он форматтер, а не линтер.
    args = ['run', 'lint']
    inputs.dir('src')
    inputs.files('package.json', 'yarn.lock', 'eslint.config.js')
    outputs.upToDateWhen { false }
}

tasks.register('yarnBuild', YarnTask) {
    dependsOn('yarnInstall')
    args = ['run', 'build']
}

tasks.register('copyFrontend', Copy) {
    dependsOn('yarnBuild')
    from('build') {
        include 'index.html'
        include 'static/**'
        include 'manifest.json', 'favicon.ico', 'robots.txt'
    }
    into("${project(':backend').projectDir}/build/resources/main/static")
}

tasks.named('build') {
    dependsOn('copyFrontend')
}

// Тесты и линт — часть верификации. `./gradlew check` прогонит spotlessCheck,
// vitest и eslint.
// configureEach + matching: безопасно, даже если задачи `check` нет в этом модуле.
tasks.matching { it.name == 'check' }.configureEach {
    if (runFrontendTests) {
        dependsOn('yarnTest')
        dependsOn('yarnLint')
    }
}

tasks.named('clean') {
    delete('build')
    // node_modules не чистим — это дорого
}