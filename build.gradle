plugins {
    id 'java'
    id 'com.diffplug.spotless' version '8.10.2' apply false
    id 'net.ltgt.errorprone' version '5.1.1' apply false
}

// Документация — такой же вход `spotlessCheck`, как код: хвостовые пробелы и отсутствие
// перевода строки в конце файла не видны в ревью, но дают шум в каждом следующем диффе.
// Prettier сюда не заведён намеренно: он переливает абзацы по своей ширине и перестраивает
// таблицы, а docs/ свёрстаны руками — переформатирование скрыло бы содержательные правки.
// Табы не трогаются: они есть внутри блоков кода (стек-трейсы), где значимы.
apply plugin: 'com.diffplug.spotless'

spotless {
    format 'markdown', {
        target 'docs/**/*.md', '*.md'

        trimTrailingWhitespace()
        endWithNewline()
    }
}

group = 'io.github.trialiya.kb'
version = '1.0.0-RC3'

repositories {
    mavenCentral()
}

project(':backend') {
    evaluationDependsOn(':frontend')
}

subprojects {
    dependencyLocking {
        lockAllConfigurations()
    }
}

dependencyLocking {
    lockAllConfigurations()
}

tasks.register('resolveAndLockAll') {
    description = 'Resolves all configurations to generate complete dependency lock files'
    group = 'dependency locking'

    notCompatibleWithConfigurationCache(
            'Generates lock files by resolving every configuration; intended to be run on demand with --write-locks'
    )

    doFirst {
        if (!gradle.startParameter.writeDependencyLocks) {
            throw new GradleException(
                    'Run this task with --write-locks, e.g. ./gradlew resolveAndLockAll --write-locks'
            )
        }
    }

    doLast {
        allprojects.each { p ->
            p.configurations.findAll { config ->
                config.canBeResolved && !config.name.toLowerCase().contains('detached')
            }.each { config ->
                try {
                    config.resolve()
                } catch (Exception e) {
                    logger.warn("Could not resolve configuration ${p.path}:${config.name}: ${e.message}")
                }
            }
        }
    }
}