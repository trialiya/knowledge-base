# Parallel execution for :backend:test.
#
# The class is the unit of parallelism: methods inside one class keep running one after another on
# the same thread, classes run against each other.  That is the split the suite is already written
# for -- a class owns its fixture (its @TempDir, its own jdbc:h2:mem:<name>, its own Spring
# context) and shares nothing with the next one, while methods inside a class routinely build on
# what @BeforeEach left in a field.
#
# So a new test class has to be able to stand next to any other: no mutable static state, no fixed
# port, nothing written outside its own @TempDir, and an in-memory database name no other class
# uses.  Where a resource genuinely cannot be split, @ResourceLock serialises the classes that
# share it rather than turning any of this off -- AbstractPostgresIntegrationTest is the one case,
# all the *IT suites run against a single container.
junit.jupiter.execution.parallel.enabled = true
junit.jupiter.execution.parallel.mode.default = same_thread
junit.jupiter.execution.parallel.mode.classes.default = concurrent

# One thread per core.  Doubling the factor was measured and moved nothing: waiting on git
# subprocesses and H2 is not what the suite spends its time on, so the extra threads buy only
# contention and more Spring contexts being built at once.
junit.jupiter.execution.parallel.config.strategy = dynamic
junit.jupiter.execution.parallel.config.dynamic.factor = 1
