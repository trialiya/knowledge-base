spring:
  application:
    name: kb-demo
  autoconfigure:
    # Auto-configurations that match on a classpath this application does not
    # choose. Every one of them costs class loading and bean definitions at
    # startup and serves nothing that runs here; the ones that hang off these
    # (the per-component Micrometer meters, the observation registrations) drop
    # out on their own once the registry they need is gone.
    #
    # The list is for classes something else on the classpath genuinely needs. A
    # dependency nothing here needs at all belongs out of the graph instead —
    # see the exclusion on spring-ai-starter-model-openai in backend/build.gradle.
    exclude:
      # Nothing collects metrics from this application: actuator exposes health
      # alone, and the OpenAI client is only handed a MeterRegistry when
      # connection-pool metrics are asked for (ChatModelRegistry).
      - org.springframework.boot.micrometer.metrics.autoconfigure.MetricsAutoConfiguration
      - org.springframework.boot.micrometer.metrics.autoconfigure.CompositeMeterRegistryAutoConfiguration
      - org.springframework.boot.micrometer.metrics.autoconfigure.export.simple.SimpleMetricsExportAutoConfiguration
      # Pageable/Sort resolved from query parameters, and Page serialization:
      # the one paged endpoint (DocumentController) builds its PageRequest
      # itself and answers with a DTO of its own.
      - org.springframework.boot.data.autoconfigure.web.DataWebAutoConfiguration
      # RestTemplate is not used anywhere; RestClient is (the MCP transports),
      # and keeps its own auto-configuration.
      - org.springframework.boot.restclient.autoconfigure.RestTemplateAutoConfiguration
  ai:
    # Which OpenAI modalities this application asks for. Chat and embedding are
    # the two it uses; the rest would each build a model bean, and their own
    # client, for nothing.
    model:
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      base-url: ${AI_BASE_URL}
      api-key: ${AI_API_KEY}
      # Call timeout of the openai-java SDK client shared by every OpenAI model (chat, embedding,
      # ...): ClientOptions.timeout plus the OkHttp client's own timeouts. Default (60s, see
      # AbstractOpenAiProperties.DEFAULT_TIMEOUT) is too short for long tool-call/generation
      # rounds and aborts the stream mid-flight with OpenAIIoException/StreamResetException(CANCEL).
      # A chat call is limited by its REQUEST deadline rather than by this one, and that deadline
      # lives in OpenAiChatOptions, out of reach of any property — ChatModelRegistry stamps this
      # value there for every connection, which is what makes it govern /compact.
      timeout: ${KB_CHAT_STREAM_TIMEOUT:10m}
      chat:
        model: ${kb.chat.default-model.id}
        max-tokens: 30000
        temperature: 0.1
        top-p: 0.8
#        extra-body:
#          thinking:
#            type: disabled
      embedding:
        base-url: ${AI_EMBED_BASE_URL:${AI_BASE_URL}}
        api-key: ${AI_EMBED_API_KEY:${AI_API_KEY}}
        model: ${kb.embedding.model:bge-m3}   # 1024-dim
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: never
      client:
        enabled: off
    retry:
      max-attempts: 2
    tools:
      # Ограничители агентного цикла (DefaultToolCallingManager). Считаются в пределах текущего
      # хода — от последнего USER-сообщения в отправленном запросе и дальше, — а не за всю историю
      # чата; вставка реплики пользователем на лету (InterjectionAdvisor) счётчик обнуляет.
      # Дефолты фреймворка (40 на инструмент, 150 суммарно) написаны под приложение с парой
      # инструментов, у нас же один ответ легально читает десятки файлов, поэтому пороги подняты.
      # -1 — отключить ограничение.
      limits:
        max-calls-per-tool-default: ${KB_TOOL_MAX_CALLS_PER_TOOL:80}
        max-total-tool-calls: ${KB_TOOL_MAX_TOTAL_CALLS:300}
        # Превышение приходит модели ошибкой в ответе инструмента — она видит стену и сворачивает
        # ответ сама. Дефолтный THROW оборвал бы прогон исключением на середине.
        on-limit-exceeded: RETURN_ERROR_RESPONSE
    # External MCP (Model Context Protocol) tool servers — see kb.mcp.enabled above, which gates
    # whether the tools these connections expose are actually merged into the chat model's tool
    # list. With no connections configured here, spring-ai-starter-mcp-client contributes zero
    # tools regardless of kb.mcp.enabled, so leaving this commented out is always safe.
    #
    # Example: a remote Jira/Confluence MCP server reachable over SSE with Bearer-token auth (the
    # connection name — "jira" here — must match the key under kb.mcp.bearer-tokens below, which
    # is what actually attaches the Authorization header; see McpClientConfig).
    # mcp:
    #   client:
    #     streamable-http:
    #       connections:
    #         atlassian:
    #           url: ${JIRA_MCP_URL}
    #     stdio:
    #       connections:
    #         filesystem:
    #           command: npx
    #           args: [ "-y", "@modelcontextprotocol/server-filesystem", "/data" ]
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/knowledgebase}
    username: ${DATASOURCE_USERNAME:knowledgebase}
    password: ${DATASOURCE_PASSWORD:knowledgebase}
    hikari:
      minimum-idle: 1
      maximum-pool-size: 10
      idle-timeout: 300000
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false
    # Доступно в миграциях как ${default_user}. По умолчанию = пользователь из kb.security.
    placeholders:
      default_user: ${kb.security.username:admin}
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 2MB
  mvc:
    async:
      request-timeout: 30m

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

kb:
  security:
    # User credentials for HTTP Basic authentication (in-memory).
    username: ${KB_SECURITY_USERNAME:admin}
    password: ${KB_SECURITY_PASSWORD:admin}
  chat:
    default-model:
      id: ${AI_MODEL}
      label: ${AI_MODEL_LABEL:Default}
      # Does this model need runScript's tutorial half (script-run-extended.md and its edit
      # counterpart) spelled out, or does it manage from the reference half alone? Defaults to
      # true (the safe assumption) when omitted — see ScriptGuideService, ChatModelProperties.
      weak: ${AI_MODEL_WEAK:true}
      # Контекстное окно модели в токенах. Не предел, который стережёт приложение (его стережёт
      # провайдер), а число, от которого считаются автоматические решения о размере истории —
      # когда написанная сводка перестаёт ждать паузы (summarize.apply-at-ratio) и когда чат
      # сжимает себя сам (summarize.auto-compact-at-ratio). Не задано — таких решений для этой
      # модели не будет вовсе. См. ChatModelProperties.ModelOption.
      context-tokens: ${AI_MODEL_CONTEXT_TOKENS:}
#    models:
#      - id: ${KB_CHAT_MODELS_0_ID}
#        label: ${KB_CHAT_MODELS_0_LABEL}
#        weak: ${KB_CHAT_MODELS_0_WEAK:true}
#        # Окно этой модели в токенах — см. default-model.context-tokens выше.
#        context-tokens: ${KB_CHAT_MODELS_0_CONTEXT_TOKENS:}
#        # Own endpoint — optional. Omitted, the model is served by spring.ai.openai.base-url with
#        # the same api-key. Set, it gets a connection of its own (ChatModelRegistry), and then
#        # api-key is REQUIRED: a foreign host with the default host's token fails at startup.
#        # api-key alone (no base-url) is allowed too: the same host, a separate token.
#        # Only here, not on default-model above — that one's endpoint is spring.ai.openai.*. To
#        # move the default model to a host of its own, add it here with the same id.
#        base-url: ${KB_CHAT_MODELS_0_BASE_URL:}
#        api-key: ${KB_CHAT_MODELS_0_API_KEY:}
    # Preset assistant modes: inject instruction fragments into the system prompt
    # (placeholder {mode_instructions} in prompt/sys.md). No mode → empty.
    modes:
      - id: analytic
        label: Аналитик
        prompt: classpath:prompt/mode-analytic.md
      - id: developer
        label: Разработчик
        prompt: classpath:prompt/mode-developer.md
      - id: tester
        label: Тестировщик
        prompt: classpath:prompt/mode-tester.md
    timeout:
      # SseEmitter timeout per browser tab subscription (replay/reconnect window).
      sse: ${KB_CHAT_SSE_TIMEOUT:30m}
    backfill:
      # Directory for the snapshot a one-off history pass takes before it rewrites anything: one
      # NDJSON file per run, holding the previous chat_message.meta of every row the pass reads.
      # Message text is NOT in it — only the columns the pass computes from and writes to.
      #
      # Unset (the default), the pass does not run at all: it computes the project trace rather
      # than reading it, and a miscomputation with nothing to restore from is not a risk worth
      # taking silently. Skipping is safe — chats without spans still answer "which repository",
      # just without per-message ranges. Point it at a mounted directory (NOT the documents export
      # path — that tree is rewritten wholesale) and restart to run the pass once.
      dump-path: ${KB_BACKFILL_DUMP_PATH:}
    summarize:
      # Tokens in the compressible slice that trigger a round. Measured on the slice — what is
      # older than the live tail — not on the whole window, so it asks the same question
      # message-count-threshold asks, just by weight instead of by count. Either one is enough.
      # The weight is the heavier of two answers: the provider's own measurements where the chat
      # carries them, and the chars-per-token estimate.
      token-threshold: ${KB_CHAT_SUMMARIZE_TOKEN_THRESHOLD:30000}
      # Compressible messages that trigger a round — the cheap half of the pair above, for long
      # dialogues that are not yet heavy in tokens.
      message-count-threshold: ${KB_CHAT_SUMMARIZE_MESSAGE_COUNT_THRESHOLD:30}
      # Recent messages kept outside the summarized window as live context.
      overlap-messages: ${KB_CHAT_SUMMARIZE_OVERLAP_MESSAGES:30}
      # Recent USER messages kept outside the summarized window. Works together with
      # overlap-messages, not instead of it — the live tail must satisfy both, so a single
      # question followed by a long tool marathon cannot push the user's own recent questions
      # into the summary just because the raw message count already fits. Note that every tail
      # rule only moves the boundary earlier, so none of them caps the size of the live window.
      overlap-user-messages: ${KB_CHAT_SUMMARIZE_OVERLAP_USER_MESSAGES:3}
      # Number of stored summaries that triggers collapsing them into one meta-summary. Kept low
      # on purpose: summaries now carry more detail (see prompt/summarizer.md's Budget section),
      # so the cap on how many uncollapsed ones ride along at once matters more than it used to.
      summary-collapse-threshold: ${KB_CHAT_SUMMARIZE_SUMMARY_COLLAPSE_THRESHOLD:3}
      # Сколько чат должен молчать, чтобы написанная сводка свернулась в историю. Пауза и делает
      # свёртку бесплатной: провайдер кэширует промпт с первого байта, поэтому правка начала
      # истории на горячем кэше стоит полностью неоплаченного запроса, а на остывшем — ничего.
      # Меряется от последнего ряда чата. Ставить чуть больше времени жизни кэша у провайдера.
      apply-after: ${KB_CHAT_SUMMARIZE_APPLY_AFTER:10m}
      # Доля окна модели, на которой сводка применяется, не дожидаясь паузы: дальше разговор
      # дорог сам по себе, и потерянный кэш — меньшая половина сделки. Доля, а не число токенов,
      # потому что само число — модели (kb.chat...context-tokens); модель без окна порога не
      # имеет и всегда ждёт паузы.
      apply-at-ratio: ${KB_CHAT_SUMMARIZE_APPLY_AT_RATIO:0.5}
      # Сколько сводок ждут применения, прежде чем очередь применяется без всякого другого
      # повода. Отложенное сжатие промпт не укорачивает, и следующий раунд читает окно длиннее
      # предыдущего: после нескольких раундов подряд оплата этой длины перевешивает кэш, который
      # применение обесценит. Для модели без названного окна это вообще единственный предел
      # кроме паузы — apply-at-ratio у неё не работает.
      apply-at-queue: ${KB_CHAT_SUMMARIZE_APPLY_AT_QUEUE:3}
      # Доля окна модели, на которой чат сжимает себя сам перед очередным ответом — последний
      # рубеж, заметно выше apply-at-ratio: пара прогонов с инструментами набивает окно быстрее,
      # чем фоновая суммаризация успевает что-то записать, а прогон за пределом окна не отвечает
      # плохо — он не начинается. Запас под самим окном нужен: раунд сжатия читает тот же
      # контекст, который сжимает. Модель без окна автоматически не сжимается.
      auto-compact-at-ratio: ${KB_CHAT_SUMMARIZE_AUTO_COMPACT_AT_RATIO:0.8}
      # Characters per estimated token (rough heuristic, no real tokenizer) — the second opinion
      # next to the measurements, and the only weighing on a chat that carries none.
      chars-per-token: ${KB_CHAT_SUMMARIZE_CHARS_PER_TOKEN:4}
      # Модель фоновой суммаризации. Пусто — модель чата по умолчанию (spring.ai.openai.chat.model
      # выше). Раунд идёт в фоне по срезу, которого никто не ждёт, и модель чата, выбранная
      # пользователем, на него всё равно не влияет, — поэтому модель подешевле здесь ничем не
      # оплачивается. Эндпоинт при этом остаётся spring.ai.openai.base-url: это опция запроса, а не
      # второе подключение, и модель из kb.chat.models со своим base-url сюда не годится.
      model: ${KB_CHAT_SUMMARIZE_MODEL:}
      # Насколько суммаризатору «размышлять»: reasoning_effort у OpenAI, thinking.type — у
      # распространённого вендорского расширения. Пусто — поле не отправляется вовсе; для thinking
      # это единственный безопасный default, потому что эндпоинт, который поля не знает, отвергает
      # весь запрос, а не игнорирует его. Убавлять стоит именно здесь: сводка пересказывает то, что
      # у модели и так перед глазами, а раунд её запросто тратит на размышления больше токенов,
      # чем длина документа, который он в итоге пишет.
      reasoning-effort: ${KB_CHAT_SUMMARIZE_REASONING_EFFORT:}
      thinking: ${KB_CHAT_SUMMARIZE_THINKING:}
  documents:
    export-path: ${DOCUMENTS_EXPORT_PATH}
    replace: true
  # Repositories the assistant reads and (optionally) edits. A caller that names no project
  # (a summary, a background job, a chat that never chose) gets the FIRST entry here.
  # Each entry needs a mount of its own and a git safe.directory exception for it (docker/start.sh);
  # see docs/проект/конфигурация.md.
  projects:
    - id: default
      label: ${PROJECT_LABEL:Project}
      # The Git repository indexed and served to the chat model (GitFunction/GitEditFunction).
      # kb.git.project-path is the pre-kb.projects spelling of the same thing and still works.
      path: ${PROJECT_PATH:${kb.git.project-path:}}
      # Whether the edit tools (createFile/editFile) may write to THIS repository. Set per project —
      # there is no deployment-wide default. Even when true, writes are withheld if the working
      # tree is not writable (ro mount); see GitRegistry.
      edit-enabled: ${KB_GIT_EDIT_ENABLED:false}
      # Whether those edits may land on an UNTRACKED file — one served only through allow-globs
      # below. Off, that area is read-only: listed, readable, greppable, and every write to it is
      # refused. Only narrows edit-enabled, so it does nothing while that one is false.
      untracked-edit-enabled: ${KB_GIT_UNTRACKED_EDIT_ENABLED:false}
      # Ant-style globs naming untracked files of this repository the assistant may also read (and
      # edit, with untracked-edit-enabled; never create). Inside these globs the working tree is
      # the truth — .gitignore does not hide anything from them — so each glob must start with a
      # real directory, and the app refuses to start otherwise. grepContent skips these files
      # unless asked. Empty — tracked files only. e.g. ["notes/**", "build/reports/**"]
      allow-globs: []
      # Git commands a USER may run on this repository from the UI (the model gets no tool for
      # any of them). Off, the panel shows no git controls at all. Even on, they are withheld
      # when the working tree is not writable — every one of them writes, a fetch included.
      git-commands:
        enabled: ${KB_GIT_COMMANDS_ENABLED:false}
        # push is the only one that publishes this repository outside the deployment, so it is a
        # grant of its own. Only narrows `enabled` — it does nothing while that one is false.
        push-enabled: ${KB_GIT_PUSH_ENABLED:false}
    # A slot for a second repository, switched off until PROJECT2_ENABLED=true. Off, it is out of
    # the catalogue entirely — not opened, not validated, not listed, not routable — so this block
    # (and its mount) can land before anyone serves it. Turning it on takes the flag, the mount at
    # PROJECT2_PATH and nothing else; further projects go on the same way, but adding a THIRD entry
    # means editing this list (an env-only list would have to be given whole — Spring does not
    # merge list entries across property sources).
    - id: ${PROJECT2_ID:billing}
      label: ${PROJECT2_LABEL:}
      path: ${PROJECT2_PATH:/projects/billing}
      edit-enabled: ${PROJECT2_EDIT_ENABLED:false}
      untracked-edit-enabled: ${PROJECT2_UNTRACKED_EDIT_ENABLED:false}
      allow-globs: []
      git-commands:
        enabled: ${PROJECT2_GIT_COMMANDS_ENABLED:false}
        push-enabled: ${PROJECT2_GIT_PUSH_ENABLED:false}
      enabled: ${PROJECT2_ENABLED:false}
  script:
    # The runScript tool: the model writes a short JS script that walks the repository itself,
    # instead of a dozen grep/read round-trips. The script has NO filesystem — the engine is built
    # without one — and reaches files only through the injected `kb` object, which goes through the
    # same tracked-files rules as every other tool. Still an explicit opt-in: it is executed code.
    enabled: ${KB_SCRIPT_ENABLED:false}
    # Let scripts write (kb.edit/kb.create for text, kb.writeBytes/kb.createBytes for bytes).
    # Necessary but not sufficient: the project's kb.projects[].edit-enabled must also be on and
    # its working tree writable — the same two gates as the editFile tool, so scripts can never be
    # a way around a read-only deployment. Separate flag so a deployment can keep the
    # edit tools and still hand the model read-only scripts. See ScriptEditPolicy.
    edit-enabled: ${KB_SCRIPT_EDIT_ENABLED:true}
    # Handbook injected into the system prompt while the tool is enabled (ScriptGuideService),
    # in two halves. The reference half is unconditional — the kb API, the limits and the error
    # table are what no model can guess. The extended half is a standing order to load the
    # matching skill from prompt/skills/ before writing a script (SkillService) — appended only
    # for a run whose model is flagged weak (kb.chat.default-model.weak / kb.chat.models[].weak);
    # a strong model reaches the same skill through the catalogue's trigger. Empty when
    # enabled=false, so a model that cannot run scripts is never told about them. Budget numbers
    # are substituted, not copied.
    guide: classpath:prompt/script-run.md
    extended-guide: classpath:prompt/script-run-extended.md
    # Appended only when writes are actually available — telling a model about methods it cannot
    # call wastes its attempts. Split the same way: the rules always, the order to load the
    # script-editing skill only for a run whose model is flagged weak.
    edit-guide: classpath:prompt/script-run-edit.md
    extended-edit-guide: classpath:prompt/script-run-edit-extended.md
    timeout: ${KB_SCRIPT_TIMEOUT:10s}   # default wall-clock budget for one script
    max-timeout: 30s                    # ceiling for the tool's own timeoutSeconds argument
    cancel-poll: 50ms                   # how often the watchdog rechecks deadline + stop flag
    limits:
      # These do NOT bound the model's context: what a script reads stays in the script, and the
      # only things that reach the model are its return value and its log, capped below. What is
      # left to bound is the backend — so they are sized to stop a runaway loop, not to stop the
      # work. A repository-wide pass is what the tool is for; this project tracks 629 files.
      max-files-read: 2000
      # Covers kb.read and the text kb.grep/kb.searchDocs hand back. The nearest thing to a heap
      # bound available: Graal's own memory limit needs Oracle GraalVM (see ScriptRunner).
      max-bytes-read: 32MB
      max-calls: 2000           # backstop for a loop that stays under every other budget
      max-log-chars: 20000
      max-result-chars: 20000
      max-edited-files: 20      # writes only; a buggy loop must not rewrite the repository
      max-edited-bytes: 256KB
  mcp:
    # Expose tools from external MCP (Model Context Protocol) servers to the chat model, in
    # addition to the built-in git/document tools. Default off — external MCP servers run
    # arbitrary local commands (stdio transport) or call arbitrary URLs (SSE/streamable-HTTP
    # transport), so this is an explicit opt-in even once servers are configured below.
    enabled: ${KB_MCP_ENABLED:false}
    # Bearer tokens for authenticated remote MCP servers, keyed by connection name (must match a
    # key under spring.ai.mcp.client.sse.connections / .streamable-http.connections above) —
    # applied as "Authorization: Bearer <token>" on every request to that connection. See
    # McpClientConfig. A connection with no entry here is left unauthenticated.
    # bearer-tokens:
    #   atlassian: ${JIRA_MCP_TOKEN:}
    # Arbitrary extra headers per connection, for servers that need more than a bearer token —
    # e.g. mcp-atlassian's multi-tenant mode also wants a cloud/tenant id header alongside
    # Authorization (https://mcp-atlassian.soomiles.com/docs/authentication). A header named
    # "Authorization" here replaces the one built from bearer-tokens above rather than duplicating
    # it, so headers can also carry the full auth scheme on their own without bearer-tokens set.
    # headers:
    #   atlassian:
    #     X-Atlassian-Cloud-Id: ${JIRA_CLOUD_ID:}
  embedding:
    # Must match spring.ai.openai.embedding.model.
    # Stored alongside every cached vector so that model upgrades invalidate old cache rows.
    # Default matches the fallback of spring.ai.openai.embedding.model above: without it the
    # h2 profile (semantic search off, AI_EMBED_* not required) leaves the placeholder
    # unresolved and the Settings panel shows the literal "${AI_EMBED_MODEL}".
    model: ${AI_EMBED_MODEL:bge-m3}
    # Number of documents sent to embedBatch() per slice during reindexAll().
    # Keep below OpenAI's per-request limit (~2 048 inputs / ~300 k tokens).
    reindex-batch-size: 50
    # Max concurrent OpenAI embedding API calls (semaphore on virtual-thread executor).
    workers: 4
    # How many embedding_tasks rows to claim per scheduler poll.
    poll-batch-size: 20
    # Delay between scheduler polls in milliseconds.
    poll-interval-ms: 1000
    # Maximum attempts before a task is permanently marked failed.
    max-attempts: 3
    # Linear retry backoff: a failed task waits attempts * this many seconds before re-claim.
    retry-backoff-seconds: 30
    # Minutes a task may stay in 'starting' before the stuck-task reaper resets it.
    stuck-timeout-minutes: 10
    # Delay between stuck-task reaper runs in milliseconds.
    stuck-check-ms: 300000
    # Days to keep done/failed/superseded rows before cleanup deletes them.
    cleanup-retention-days: 7
    cache:
      # Set to false to bypass the Postgres cache entirely (e.g. in tests).
      enabled: true
      # Rows not accessed for this many days are deleted by EmbeddingCacheCleanupTask.
      ttl-days: 30
      # Spring cron expression for the cleanup job (server local time).
      # Default: every day at 02:00.
      cleanup-cron: "0 0 2 * * *"
    chunker:
      # Maximum tokens per chunk. Must be well below the model's 8 192-token limit.
      max-tokens: 512
      # Token overlap between adjacent chunks to avoid missing cross-boundary context.
      overlap-tokens: 64
  search:
    keyword:
      limit: 20
    semantic:
      enabled: true
      threshold: 0.20
      limit: 20
    hybrid:
      keyword-weight: 0.4   # вес keyword-результатов (0..1)
      semantic-weight: 0.6  # вес semantic-результатов (0..1)
      threshold: 0.20       # минимальная семантическая схожесть
      limit: 20
    subagent:
      # Search sub-agent exposed to the chat model as the `searchCodebase` tool.
      enabled: ${KB_SEARCH_SUBAGENT_ENABLED:true}
      # May differ from the main chat model (e.g. a cheaper/faster one). Defaults to the main model.
      # Its runScript tutorial half is gated by this id's own weak flag (kb.chat.default-model.weak
      # / kb.chat.models[].weak), not by whatever model the current chat turn happens to use.
      model-id: ${KB_SEARCH_SUBAGENT_MODEL:${AI_MODEL}}
      max-tokens: ${KB_SEARCH_SUBAGENT_MAX_TOKENS:12000}
      # Hard cap on tool-call rounds before a forced, tool-less summarization call.
      max-iterations: ${KB_SEARCH_SUBAGENT_MAX_ITERATIONS:30}
      # Read-only tools the sub-agent may call. MUST NOT include searchCodebase (recursion guard).
      # runScript is here as the sub-agent's own forced-read-only copy (see ChatConfig): its write
      # methods are withheld regardless of kb.script.edit-enabled. Listing it costs nothing when
      # kb.script.enabled=false — the tool simply is not among the callbacks to filter.
      allowed-tools:
        - runScript
        - grepContent
        - searchFiles
        - getFileTree
        - getFileOutline
        - getFileContent
        - searchDocuments
        - grepDocuments
        - findDocumentsByName
        - getDocument
        - getDocumentOutline
        - getDocumentSection
        - getTreeSkeleton
  system-prompt:
    # System prompt: split into reference (for all models) and extended (tutorial for weak models).
    # The reference half contains rules, tool selection, and concise guidance; the extended half
    # provides decision trees, workflow examples, and common mistakes (appended only for weak models).
    prompt: classpath:prompt/sys.md
    extended-prompt: classpath:prompt/sys-extended.md

logging:
