plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless'
    id 'net.ltgt.errorprone'
    id 'pmd'
    id 'com.github.spotbugs' version '6.5.11'
    // apply false: плагин включается по флагу ниже, иначе он меняет обычный bootJar.
    id 'org.graalvm.buildtools.native' version '1.1.12' apply false
}

group = 'io.github.trialiya.kb'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Никакого `compileOnly.extendsFrom annotationProcessor`: net.ltgt.errorprone вешает свою
// конфигурацию errorprone на annotationProcessor, и через такое наследование error_prone_core
// со всеми транзитивными зависимостями (guava, protobuf, google-java-format) уехал бы в
// compileClasspath. Lombok и так объявлен в обеих конфигурациях явно — см. dependencies.

repositories {
    mavenCentral()
    mavenLocal()
}

// Присваивание, а не set('springAiVersion', ...): dependabot резолвит подстановку
// ${springAiVersion} в mavenBom ниже только для этой формы (и для котлиновской extra.set) —
// с вызовом set(...) версия остаётся неразрешённой, и зависимость молча выпадает из проверки.
ext {
    springAiVersion = '2.0.1'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.apache.httpcomponents.client5:httpclient5'

    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    implementation 'org.postgresql:postgresql'
    implementation 'com.h2database:h2'
    // Same Spring Boot 4 extraction as spring-boot-flyway below: H2ConsoleAutoConfiguration left
    // spring-boot-autoconfigure for its own module. Without it spring.h2.console.enabled (set by
    // the h2 profile) silently does nothing and /h2-console answers 404. See SecurityConfig, which
    // has to let the console out of the default X-Frame-Options: DENY to render its frameset.
    implementation 'org.springframework.boot:spring-boot-h2console'
    // Spring Boot 4 extracted FlywayAutoConfiguration out of spring-boot-autoconfigure into the
    // dedicated spring-boot-flyway module, which flyway-core does not pull transitively. Without it
    // migrations never run (neither at app startup nor in @DataJdbcTest slices).
    implementation 'org.springframework.boot:spring-boot-flyway'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // Chat and embeddings, over the openai-java SDK (OkHttp) rather than a Spring HTTP client.
    // The starter also asks for spring-boot-starter-webclient, and nothing here answers through
    // it: neither spring-ai-openai nor its auto-configuration mentions WebClient, and the servlet
    // chain is what guards the endpoints. Dropped, it takes spring-webflux, reactor-netty and all
    // of Netty with it — the five platform QUIC natives alone are ~12 MB of the JAR — and the
    // auto-configurations that matched on those classes stop existing rather than being excluded
    // by name. reactor-core stays: the MCP SDK and Spring AI's own streaming are built on it.
    implementation('org.springframework.ai:spring-ai-starter-model-openai') {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-webclient'
    }
    // MCP (Model Context Protocol) client — lets the chat model call tools exposed by external MCP
    // servers (stdio subprocess or SSE/streamable-HTTP), on top of the built-in git/document tools.
    // httpclient-based variant (not -webflux) to match the servlet stack. See ChatConfig.chatClientBuilder
    // and kb.mcp.enabled.
    implementation 'org.springframework.ai:spring-ai-starter-mcp-client'

    // Spring Boot 4 makes Jackson 3 (tools.jackson) the auto-configured JSON mapper and demotes
    // the retained Jackson 2 modules to runtime-only. Our internal serialization (chat message
    // meta, Spring Data JDBC converters, tool-call persistence) still targets Jackson 2, so pull its
    // Java-time module back onto the compile classpath. Version is managed by the Jackson 2 BOM.
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    implementation 'com.google.guava:guava:33.7.1-jre'

    implementation 'io.github.bonede:tree-sitter:0.26.6'
    implementation 'io.github.bonede:tree-sitter-java:0.23.5'
    implementation 'io.github.bonede:tree-sitter-javascript:0.25.0'
    implementation 'io.github.bonede:tree-sitter-typescript:0.23.2'
    implementation 'io.github.bonede:tree-sitter-python:0.25.0'

    // GraalJS as the engine behind the runScript tool (see ScriptRunner). Chosen for what it can
    // be denied rather than what it can do: a Context built without IO, host class lookup or
    // threads leaves the script no way to reach the filesystem at all — the only door out is the
    // injected `kb` object. It is also the only option that can still cancel a runaway script,
    // since Thread.stop is gone (JDK 20) and the Security Manager is permanently disabled
    // (JEP 486, JDK 24). On a stock JDK this runs interpreted — fine for glue code, which is why
    // kb.script.limits exists.
    implementation 'org.graalvm.polyglot:polyglot:25.0.4.1'
    implementation 'org.graalvm.polyglot:js-community:25.0.4.1'

    implementation 'org.jspecify:jspecify:1.0.1'
    errorprone 'com.google.errorprone:error_prone_core:2.50.0'
    errorprone 'com.uber.nullaway:nullaway:0.14.1'
    // In-process Git access for GitService (file tree, log, diff, status). git grep has no JGit
    // equivalent, so that one operation still shells out to the git binary.
    implementation 'org.eclipse.jgit:org.eclipse.jgit:7.7.1.202607240634-r'
    compileOnly 'org.projectlombok:lombok'

//	developmentOnly 'org.springframework.boot:spring-boot-devtools'

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Spring Boot 4 extracted the per-slice test support out of spring-boot-test-autoconfigure
    // into dedicated spring-boot-<module>-test artifacts (@DataJdbcTest, @AutoConfigureTestDatabase).
    testImplementation 'org.springframework.boot:spring-boot-data-jdbc-test'
    testImplementation 'org.springframework.boot:spring-boot-jdbc-test'
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test' // @WebMvcTest, @AutoConfigureMockMvc
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
        // Spring Boot 4 no longer manages Testcontainers versions in its BOM, so import it directly.
        mavenBom "org.testcontainers:testcontainers-bom:2.0.5"
    }
}

spotless {
    java {
        googleJavaFormat('1.30.0').aosp()
        importOrder()
        removeUnusedImports()
        endWithNewline()
    }
}

pmd {
    toolVersion = '7.27.0'
    // The whole rule selection lives in that file; ruleSets = [] drops Gradle's own default
    // (category/java/errorprone.xml + bestpractices.xml), which would otherwise be added on top.
    ruleSets = []
    ruleSetConfig = resources.text.fromFile(rootProject.file('config/pmd/ruleset.xml'))
    consoleOutput = true
}

// Сгенерированные AOT-исходники Spring — не наш код: ни PMD, ни NullAway на них не гоняем.
// Отбор по имени задачи, а не tasks.named: aot-наборы появляются только с -Pkb.native, и в
// обычной сборке искать их по имени нечего, а с флагом сюда попадёт и третий набор, если он
// когда-нибудь заведётся.
tasks.withType(JavaCompile).configureEach {
    if (name.startsWith('compileAot')) {
        options.errorprone.enabled = false
    }
}

tasks.withType(Pmd).configureEach {
    // Задача pmdAot* создаётся без classpath, на котором падает фильтр ниже, поэтому выходим
    // раньше него.
    if (name.startsWith('pmdAot')) {
        enabled = false
        return
    }
    // org.graalvm.js:js-community is a pom-packaging module, so its .pom lands on the compile
    // classpath as the artifact itself. PMD's auxClasspath loader opens every non-directory entry
    // as a zip and dies on the first one ("zip END header not found"), so keep jars and class
    // directories only.
    classpath = classpath.filter { it.isDirectory() || it.name.endsWith('.jar') }
}

spotbugs {
    toolVersion = '4.10.4'
    // valueOf rather than Effort.MAX / Confidence.DEFAULT: Groovy resolves the bare constant
    // name to a nested class (Confidence$DEFAULT) and the assignment fails to convert.
    effort = com.github.spotbugs.snom.Effort.valueOf('MAX')
    reportLevel = com.github.spotbugs.snom.Confidence.valueOf('DEFAULT')
    excludeFilter = rootProject.file('config/spotbugs/exclude.xml')
}

// Main sources only — the same cut compileTestJava takes for NullAway below. Test code passes
// nulls on purpose, duplicates fixtures on purpose and leans on JUnit lifecycle for cleanup, all
// of which these rules exist to stop in production code.
tasks.named('pmdTest') {
    enabled = false
}

tasks.named('spotbugsTest') {
    enabled = false
}

// Both plugins wire their tasks into `check` by default, and both are unwired here so that
// `build` costs what it did before. Neither tool is incremental — one edited file re-analyses
// every source, ~14s — which is a poor trade on each local build. They are invoked by name
// instead: `./run/test.sh lint`, the pre-pr gate, and the static-analysis step of backend-pr.yml.
//
// Two different mechanisms, because the plugins wire themselves up differently:
//   * PMD reads `check`'s dependency off pmd.sourceSets, while the tasks are created for every
//     source set regardless — so emptying the list keeps pmdMain and pmdTest available by name.
//   * SpotBugs hangs a TaskCollection of its own on check, which has to be filtered back out.
pmd.sourceSets = []
tasks.named('check') {
    setDependsOn(
            dependsOn.findAll { dep ->
                !(dep instanceof TaskCollection)
                        || !dep.any { it instanceof com.github.spotbugs.snom.SpotBugsTask }
            })
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
    reports {
        // Without an explicit report the plugin only prints to the console and leaves nothing
        // behind to open after a CI run.
        html.required = true
        xml.required = true
    }
}

tasks.withType(JavaCompile).configureEach {
    options.errorprone {
        disableAllChecks = true
        error('NullAway')
        option('NullAway:OnlyNullMarked', 'true')
        option('NullAway:JSpecifyMode', 'true')
    }
}

// NullAway still checks calls FROM test code INTO @NullMarked production code (OnlyNullMarked
// only exempts unmarked code from having its *own* nullness checked, not from being a caller) —
// tests deliberately pass null to exercise edge cases, so that call-site check is just noise here.
tasks.named('compileTestJava') {
    options.errorprone.enabled = false
}

// Классы тестов идут параллельно; модель и то, что она требует от нового теста, — в
// src/test/resources/junit-platform.properties. JVM при этом одна: maxParallelForks изолировал бы
// надёжнее, но каждый форк заново строит контексты Spring (их кэш живёт внутри JVM) и поднимает
// свой контейнер, а набор тестов слишком короткий, чтобы эта плата окупилась.
tasks.named('test') {
    useJUnitPlatform()
}

// Статику фронтенда упаковывают сами архивные задачи, читая её из build-каталога
// :frontend. В build/resources/main она попасть не должна: этот каталог — выход
// processResources, и всякая задача, которая его читает (jar, bootJar, test,
// resolveMainClassName), падала бы на implicit dependency validation, пока в неё
// поимённо не проставлен dependsOn на :frontend:copyFrontend.
// Зависимость висит только на упаковке, поэтому `:backend:test` по-прежнему не
// собирает фронтенд (на это рассчитан backend-pr.yml).
def frontendStatic = project(':frontend').layout.buildDirectory.dir('static')

bootJar {
    archiveFileName = 'kb.jar'
    // Имя не зависит от версии, а манифест Gradle входом задачи не считает: без этой
    // строки после смены версии bootJar остаётся UP-TO-DATE и отдаёт kb.jar со старой
    // Implementation-Version — тем самым числом, которое показывает админ-панель.
    inputs.property('projectVersion', providers.provider { project.version.toString() })
    dependsOn ':frontend:copyFrontend'
    from(frontendStatic) {
        into 'BOOT-INF/classes/static'
    }
}

jar {
    dependsOn ':frontend:copyFrontend'
    from(frontendStatic) {
        into 'static'
    }
}

// Экспериментальная сборка в нативный образ. Как собирать, что при этом ломается и почему —
// docs/проект/нативный-образ-graalvm.md; здесь только сами ручки.
//
// Всё выключено по умолчанию, и нативная ветка — тоже: плагин подключает Spring AOT, и bootJar
// начинает собираться из aot-набора — с определениями бинов, запечёнными под один профиль.
// Без -Dspring.aot.enabled=true на запуске они мертвы, так что kb.jar остаётся прежним, но
// сборка дорожает на processAot, а с kb.native.tests требует ещё и Docker.
// Флаг-переключатель: свойство Gradle или переменная окружения, в обоих случаях '0' и 'false'
// читаются как «выключено». Без этого -Pkb.native=false включал бы ветку, потому что Gradle
// отдаёт значение свойства, а не его истинность.
// Пустое значение у двух источников значит разное, поэтому и разбираются они порознь:
// -Pkb.native без значения — это пустая строка и «включить», а KB_NATIVE= — это переменная,
// которую CI подставил из незаданного входа, и включать по ней нечего.
def switchedOn = { name, envName ->
    def property = findProperty(name)
    if (property != null) {
        return property != '0' && property != 'false'
    }
    def env = System.getenv(envName)
    env && env != '0' && env != 'false'
}
def nativeBuild = switchedOn('kb.native', 'KB_NATIVE')
// Профиль, под который снимается AOT и который запекается в образ. Без него processAot гонит
// Postgres-миграции на встроенной H2. Образ под Postgres — отдельная сборка.
def aotProfile = findProperty('kb.aot.profile') ?: 'h2'
// Предел кучи и число потоков сборщика образа. По умолчанию не задаём: native-image берёт
// 85% памяти хоста и все ядра. Задавать нужно там, где процесс живёт в cgroup с лимитом
// меньше памяти хоста, — лимита он не видит, и его снимает OOM-killer.
def nativeHeap = findProperty('kb.native.heap')
def nativeThreads = findProperty('kb.native.threads')
// Быстрая сборка ценой скорости образа: для отладочной итерации, где проверяется не
// производительность, а работоспособность.
def nativeQuick = switchedOn('kb.native.quick', 'KB_NATIVE_QUICK')
// Строгий режим метаданных. На всё приложение (-Pkb.native.exact или =true) сборка на
// GraalVM 25.0.4 падает на инициализации (oracle/graal#13316), поэтому на деле задаётся
// списком пакетов: -Pkb.native.exact=io.github.trialiya.kb. Значение уходит в аргумент
// native-image как есть, а тот принимает только имена пакетов и классов, так что 'true'
// без этой развилки молча включил бы строгость для пакета с именем «true».
def nativeExactRaw = findProperty('kb.native.exact')
def nativeExactOn = nativeExactRaw != null && nativeExactRaw != '0' && nativeExactRaw != 'false'
def nativeExactScope = (nativeExactRaw in [null, '', 'true', '1']) ? null : nativeExactRaw
// Тестовая половина Spring AOT — она же предусловие nativeTest. Выключена не из экономии:
// плагин втягивает её в граф любой обычной сборки через исходники aotTest, а она поднимает
// контекст интеграционных тестов и требует Docker.
def nativeTests = switchedOn('kb.native.tests', 'KB_NATIVE_TESTS')

if (nativeBuild) {
    apply plugin: 'org.graalvm.buildtools.native'

    // repositories.enabled=false: генератор репозиториев Spring Data JDBC на этапе AOT
    // требует живую схему БД, которой в сборке нет.
    tasks.named('processAot') {
        args '--spring.profiles.active=' + aotProfile, '--spring.aot.repositories.enabled=false'
    }
    graalvmNative {
        // GraalVM берётся из GRAALVM_HOME, иначе из JAVA_HOME.
        toolchainDetection = false
        // Каталог для вывода агента трассировки — build/, а не ресурсы: сырой вывод агента
        // в исходники не кладётся, из него руками переносится нужное в NativeHints.
        agent {
            metadataCopy {
                outputDirectories.add('build/native-agent-metadata')
                mergeWithExisting = false
            }
        }
        binaries.named('main') {
            // Spring AOT регистрирует только db/migration/** и application*.yaml, а промпты
            // и статика фронтенда собираются по имени в рантайме. Перечислять их поштучно
            // значит ловить по одному отсутствующему файлу за сборку.
            resources.autodetect()
            if (nativeHeap) {
                buildArgs.add('-J-Xmx' + nativeHeap)
            }
            if (nativeThreads) {
                buildArgs.add('--parallelism=' + nativeThreads)
            }
            if (nativeExactOn) {
                buildArgs.add(nativeExactScope
                        ? '--exact-reachability-metadata=' + nativeExactScope
                        : '--exact-reachability-metadata')
            }
            if (nativeQuick) {
                buildArgs.add('-Ob')
            }
        }
    }
    tasks.named('processTestAot') {
        enabled = nativeTests
    }
}
